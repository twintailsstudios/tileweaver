<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Trifold Isometric Map / Weaving Grid Base -->
  <g filter="url(#shadow)" transform="translate(48, 56)">
    <!-- Left Map Fold -->
    <path d="M40,110 L140,60 L140,320 L40,370 Z" fill="#2563eb" opacity="0.9"/>
    
    <!-- Center Map Fold -->
    <path d="M140,60 L276,110 L276,370 L140,320 Z" fill="#3b82f6"/>
    
    <!-- Right Map Fold -->
    <path d="M276,110 L376,60 L376,320 L276,370 Z" fill="#1d4ed8" opacity="0.85"/>

    <!-- Dual-Grid Isometric Tile Overlay Nodes on Center Fold -->
    <!-- Top Diamond -->
    <polygon points="208,125 248,145 208,165 168,145" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Left Diamond -->
    <polygon points="168,165 208,185 168,205 128,185" fill="#60a5fa" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Right Diamond -->
    <polygon points="248,165 288,185 248,205 208,185" fill="#818cf8" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Bottom Center Diamond (Dual Grid Convergence Node) -->
    <polygon points="208,205 248,225 208,245 168,225" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Contour / Autotile Path Weave Line -->
    <path d="M60,200 Q140,180 208,205 T356,230" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-dasharray="14,10"/>
    
    <!-- Level Pin Node -->
    <circle cx="208" cy="205" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
